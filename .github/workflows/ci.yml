name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python 3.14 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and tooling
        run: python -m pip install -e ".[dev]"

      - name: Check formatting
        run: black --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy .

      - name: Security scan
        run: bandit -r .

      - name: Dependency audit
        run: pip-audit .

      - name: Test
        run: pytest -q

      - name: Package check
        if: runner.os != 'Windows'
        run: scripts/eramba-package-check
        env:
          PYTHON: python

      - name: Package check on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\eramba-package-check.cmd
        env:
          PYTHON: python
